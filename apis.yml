aid: sunyur
name: Sunyur
description: >-
  Sunyur (商越科技 / Beijing Sunyur Network Technology Co., Ltd, 北京商越网络科技有限公司) is a
  Chinese enterprise procurement digitalization company providing AI-driven
  procurement solutions for large and medium enterprises. Its products include an
  intelligent procurement middle-platform (采购中台), an SRM supplier relationship
  management system, an e-procurement SaaS platform, and a procurement mall
  (采购商城), helping each customer build a dedicated online, digital, and
  intelligent enterprise procurement platform to raise efficiency and lower cost.
  Sunyur operates an open integration platform ("聚贤阁", open.sunyur.com) that
  connects enterprises to 30+ mainstream e-commerce platforms and 10+ third-party
  applications through a single accessToken-authenticated API surface. Sunyur is
  backed by Qiming Venture Partners.
